events { worker_connections 1024; }

http {
  limit_req_zone $binary_remote_addr zone=edge:10m rate=20r/s;
  upstream api_upstream { server api:8080; keepalive 32; }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name api.example.com;
    ssl_certificate /run/secrets/tls/fullchain.pem;
    ssl_certificate_key /run/secrets/tls/privkey.pem;
    client_max_body_size 6m;

    location / {
      limit_req zone=edge burst=40 nodelay;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-Id $request_id;
    }
  }
}
